# ==============================================================================
# Pentagon Page Builder - Production Nginx Virtual Host Configuration
# ==============================================================================
# Location: /etc/nginx/sites-available/pentagon.conf -> /etc/nginx/sites-enabled/
# Enforces TLS 1.2/1.3, HSTS, script execution denial in uploads, static caching.

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name builder.example.com *.example.com;

    # Let's Encrypt ACME challenge passthrough
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pentagon/current/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Production Virtual Host (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name builder.example.com *.example.com;

    root /var/www/pentagon/current/public;
    index index.php index.html;
    charset utf-8;

    # SSL / TLS Termination
    ssl_certificate /etc/letsencrypt/live/builder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/builder.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers (Defense-in-Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Maximum payload size (aligns with 5MB media uploads)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # CRITICAL SECURITY INVARIANT: Defense-in-depth script execution prohibition
    # Completely forbids PHP or executable script processing in media or release directories
    location ^~ /storage/media/ {
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
        }
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        # Forbid executing any script
        location ~ \.(php|phtml|phar|sh|pl|py|cgi)$ {
            deny all;
        }
    }

    # Public static page delivery (M17 static releases) fallback to Laravel router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Lightweight health probe endpoint
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Static assets cache headers (Vite build outputs)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PHP-FPM FastCGI processing
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to hidden dotfiles (e.g., .git, .env)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
